<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Salam — weekly report upload</title>
<!-- Operations reports · vendor drop page (8 Oct 2026, alpha.152). One team, one expiring link (hashed on the server),
     no console account: the vendor picks the week, drops the report in its usual format, done. Server: opsReports.js. -->
<style>
:root{--bg:#f2f4f3;--card:#fff;--ink:#1a2b3c;--muted:#64748b;--line:#e2e8f0;--green:#0e9f5a;--green-dark:#0a7a45;--green-bg:#e8f7f0;--red:#dc2626;--amber:#d97706}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b1220;--card:#141f33;--ink:#e2e8f0;--muted:#94a3b8;--line:#24324d;--green-bg:#0f2f24;--green-dark:#6ee7b7}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font:15px/1.55 -apple-system,"Segoe UI",Roboto,Arial,sans-serif;display:flex;justify-content:center;padding:28px 16px}
.wrap{width:100%;max-width:560px}
.head{background:linear-gradient(135deg,#04211a 0%,#0a3a29 55%,#0c5b3e 100%);color:#eafff4;border-radius:18px 18px 0 0;padding:24px 26px}
.brand{font-size:24px;font-weight:800;letter-spacing:-.02em}.brand small{display:block;font-size:11px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:#86efc0;margin-top:4px}
.box{background:var(--card);border:1px solid var(--line);border-top:0;border-radius:0 0 18px 18px;padding:22px 26px 26px}
h1{font-size:19px;margin:0 0 4px}.muted{color:var(--muted);font-size:13px}
label{display:block;font-size:12.5px;font-weight:700;color:var(--muted);margin:14px 0 5px}
select,input[type=email],textarea{width:100%;font:inherit;font-size:14px;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:9px 11px}
select:focus,input:focus,textarea:focus{outline:none;border-color:var(--green);box-shadow:0 0 0 3px rgba(14,159,90,.18)}
.drop{margin-top:16px;display:flex;flex-direction:column;align-items:center;gap:4px;padding:26px 14px;border:2px dashed var(--line);border-radius:14px;cursor:pointer;text-align:center}
.drop.over,.drop:hover{border-color:var(--green);background:var(--green-bg)}.drop b{font-size:15px}
.btn{margin-top:18px;width:100%;font:inherit;font-size:15px;font-weight:800;color:#fff;background:var(--green);border:0;border-radius:12px;padding:12px;cursor:pointer}
.btn:disabled{opacity:.5;cursor:not-allowed}
.msg{margin-top:14px;font-size:14px;padding:10px 12px;border-radius:10px;display:none}.msg.ok{display:block;background:var(--green-bg);color:var(--green-dark)}.msg.bad{display:block;background:#fef2f2;color:#991b1b}
.file{margin-top:8px;font-size:13px;font-weight:700}.foot{margin-top:18px;font-size:11.5px;color:var(--muted);text-align:center}
</style>
</head>
<body>
<div class="wrap">
  <div class="head"><div class="brand">salam<small>Weekly report upload</small></div></div>
  <div class="box" id="box"><p class="muted">Checking the link…</p></div>
  <div class="foot">This link is personal to your team and expires. It only lets you send your weekly report to Salam ITSM.</div>
</div>
<script>
(function () {
  'use strict';
  var esc = function (s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); };
  var tok = new URLSearchParams(location.search).get('t') || '';
  var base = location.pathname.replace(/[^/]*$/, '');
  var url = base + 'api/opsreports/drop/' + encodeURIComponent(tok);
  var box = document.getElementById('box');
  var fmt = function (d) { return new Date(d + 'T00:00:00Z').toLocaleDateString('en-GB', { timeZone: 'UTC', day: 'numeric', month: 'short' }); };
  var file = null, info = null;
  function bad(m) { box.innerHTML = '<h1>Link not valid</h1><p class="muted">' + esc(m) + '</p>'; }
  if (!/^[A-Za-z0-9_-]{24,64}$/.test(tok)) return bad('This upload link is incomplete — open it again from the e-mail.');
  fetch(url).then(function (r) { return r.json().then(function (j) { if (!r.ok) throw new Error(j.error || 'HTTP ' + r.status); return j; }); }).then(function (j) {
    info = j;
    var weeks = j.weeks.map(function (w) { return '<option value="' + w.week + '"' + (w.status === 'submitted' || w.status === 'approved' ? ' disabled' : '') + '>' + fmt(w.from) + ' – ' + fmt(w.to) + (w.status ? ' · ' + (w.status === 'draft' ? 'received' : w.status) : '') + '</option>'; }).join('');
    box.innerHTML = '<h1>' + esc(j.team.name) + '</h1><p class="muted">' + esc(j.team.formatNote || 'Send the report in your usual format.') + '</p>' +
      '<label for="w">Reporting week</label><select id="w">' + weeks + '</select>' +
      '<label class="drop" id="dz" for="f"><input type="file" id="f" hidden><b>Choose or drop the report</b><span class="muted">' + esc(j.accept.join(' · ')) + ' — up to ' + j.maxMB + ' MB</span><span class="file" id="fn"></span></label>' +
      '<label for="e">Your e-mail (so ITSM knows who sent it)</label><input type="email" id="e" autocomplete="email" placeholder="name@company.com">' +
      '<label for="n">Note (optional)</label><textarea id="n" rows="2" maxlength="500"></textarea>' +
      '<button class="btn" id="go" disabled>Send the report</button><div class="msg" id="msg"></div>';
    var dz = document.getElementById('dz'), fi = document.getElementById('f');
    var pick = function (f) { if (!f) return; if (f.size > j.maxMB * 1048576) { show('The file is over ' + j.maxMB + ' MB.', true); return; } file = f; document.getElementById('fn').textContent = f.name + ' · ' + Math.round(f.size / 1024) + ' KB'; document.getElementById('go').disabled = false; };
    fi.addEventListener('change', function () { pick(fi.files[0]); });
    ['dragenter', 'dragover'].forEach(function (ev) { dz.addEventListener(ev, function (e) { e.preventDefault(); dz.classList.add('over'); }); });
    ['dragleave', 'drop'].forEach(function (ev) { dz.addEventListener(ev, function (e) { e.preventDefault(); dz.classList.remove('over'); }); });
    dz.addEventListener('drop', function (e) { pick(e.dataTransfer.files[0]); });
    document.getElementById('go').addEventListener('click', upload);
  }).catch(function (e) { bad(e.message); });
  function show(m, isBad) { var el = document.getElementById('msg'); if (el) { el.textContent = m; el.className = 'msg ' + (isBad ? 'bad' : 'ok'); } }
  function upload() {
    var btn = document.getElementById('go'); btn.disabled = true; btn.textContent = 'Sending…';
    var fr = new FileReader();
    fr.onload = function () {
      var body = { week: document.getElementById('w').value, name: file.name, mime: file.type, data: String(fr.result).replace(/^data:[^,]*,/, ''), email: document.getElementById('e').value, note: document.getElementById('n').value };
      fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) })
        .then(function (r) { return r.json().then(function (j) { if (!r.ok) throw new Error(j.error || 'HTTP ' + r.status); return j; }); })
        .then(function (j) { show(j.duplicate ? 'This file was already received — nothing else to do.' : 'Received — thank you. Salam ITSM has been told. You can send another file (an annex) the same way.'); btn.textContent = 'Send another file'; file = null; document.getElementById('fn').textContent = ''; })
        .catch(function (e) { show(e.message, true); btn.disabled = false; btn.textContent = 'Send the report'; });
    };
    fr.onerror = function () { show('Could not read the file.', true); btn.disabled = false; btn.textContent = 'Send the report'; };
    fr.readAsDataURL(file);
  }
})();
</script>
</body>
</html>
